<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Arcade—Play Simple Web Games</title>
	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
	<link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
	<header class="site-header">
		<nav class="nav">
			<a class="logo" href="/">Arcade<span class="dot">.</span></a>
			<div class="nav-actions">
				<a class="btn" href="#games">Games</a>
				<a class="btn outline" href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a>
			</div>
		</nav>
		<section class="hero">
			<h1>Casual games, zero installs.</h1>
			<p>Fast, minimal, and works everywhere. Tap a title and start playing.</p>
			<div class="cta">
				<a class="btn primary" href="#games">Play now</a>
			</div>
		</section>
	</header>

	<main>
		<section id="games" class="games">
			<h2>Games</h2>
			<ul class="game-grid">
				<li class="game-card">
					<a href="/games/snake/">
						<div class="thumb thumb-snake" aria-hidden="true"></div>
						<h3>Snake</h3>
						<p>Classic snake with smooth controls and high score.</p>
					</a>
				</li>
			</ul>
		</section>
	</main>

	<footer class="site-footer">
		<p>Built with ❤️ for the web. <span class="muted">No trackers, no ads.</span></p>
	</footer>

	<script src="/scripts/main.js"></script>
</body>
</html>
